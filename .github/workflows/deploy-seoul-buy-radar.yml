name: Deploy Seoul Buy Radar

on:
  push:
    branches: [main]
    paths:
      - "seoul-buy-radar/**"
      - ".github/workflows/deploy-seoul-buy-radar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: seoul-buy-radar-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: seoul-buy-radar

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
